<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Barricade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="topbar">
  <div class="topbar-title">
    <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
    Nekko
  </div>
  <div class="topbar-user">
    <a class="nav-link" href="games.html">← Games</a>
  </div>
</div>

<div class="game-screen">
  <h1 style="margin-bottom:14px;">🧱 Barricade</h1>

  <div class="game-hud">
    <div class="score-box">Score<br><span class="num" id="score-num">0</span></div>
    <div class="score-box">Best<br><span class="num" id="best-num">0</span></div>
    <div class="score-box">Lives<br><span class="num" id="lives-num">3</span></div>
  </div>

  <div class="game-canvas-wrap">
    <canvas id="game-canvas" width="400" height="450"></canvas>
    <div class="game-overlay" id="overlay">
      <h2 id="overlay-title">Barricade</h2>
      <p id="overlay-msg">Move the paddle to bounce the ball and clear every brick</p>
      <button class="btn" id="overlay-btn" style="width:auto; padding:10px 26px;">Start</button>
    </div>
  </div>

  <div class="game-controls-hint">Move mouse / drag finger left-right over the board to move the paddle.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/scores.js"></script>
<script>
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const PADDLE_W = 80, PADDLE_H = 12;
  const BALL_R = 7;
  const ROWS = 5, COLS = 8;
  const BRICK_W = W / COLS, BRICK_H = 22, BRICK_TOP = 40;

  let paddleX, ball, bricks, score, lives, loopId, running = false;
  let currentUser = null;
  const colors = ["#A63D40", "#C9974C", "#1F6F6B", "#B07F35", "#164F4C"];

  function resetGame() {
    paddleX = W / 2 - PADDLE_W / 2;
    ball = { x: W / 2, y: H - 60, vx: 3, vy: -4 };
    score = 0;
    lives = 3;
    bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        bricks.push({ x: c * BRICK_W, y: BRICK_TOP + r * BRICK_H, alive: true, color: colors[r % colors.length] });
      }
    }
    document.getElementById("score-num").textContent = "0";
    document.getElementById("lives-num").textContent = "3";
  }

  function draw() {
    ctx.fillStyle = "#3A2E22";
    ctx.fillRect(0, 0, W, H);

    bricks.forEach(b => {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x + 2, b.y + 2, BRICK_W - 4, BRICK_H - 4);
    });

    ctx.fillStyle = "#F5EDD8";
    ctx.fillRect(paddleX, H - 20, PADDLE_W, PADDLE_H);

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#C9974C";
    ctx.fill();
  }

  function step() {
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x < BALL_R || ball.x > W - BALL_R) ball.vx *= -1;
    if (ball.y < BALL_R) ball.vy *= -1;

    // Paddle collision
    if (ball.y > H - 20 - BALL_R && ball.y < H - 8 &&
        ball.x > paddleX && ball.x < paddleX + PADDLE_W && ball.vy > 0) {
      const hitPos = (ball.x - paddleX) / PADDLE_W; // 0 to 1
      ball.vx = (hitPos - 0.5) * 8;
      ball.vy = -Math.abs(ball.vy);
    }

    // Brick collision
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x > b.x && ball.x < b.x + BRICK_W && ball.y > b.y && ball.y < b.y + BRICK_H) {
        b.alive = false;
        ball.vy *= -1;
        score += 10;
        document.getElementById("score-num").textContent = score;
        break;
      }
    }

    // Fell off bottom
    if (ball.y > H + BALL_R) {
      lives--;
      document.getElementById("lives-num").textContent = lives;
      if (lives <= 0) {
        endGame(false);
        return;
      }
      ball.x = W / 2; ball.y = H - 60; ball.vx = 3; ball.vy = -4;
    }

    // Cleared all bricks
    if (bricks.every(b => !b.alive)) {
      endGame(true);
      return;
    }

    draw();
  }

  async function endGame(won) {
    running = false;
    clearInterval(loopId);
    let msg = `Score: ${score}`;
    if (currentUser) {
      const isRecord = await saveHighScoreIfBetter(currentUser.uid, "barricade", score);
      const best = await getHighScore(currentUser.uid, "barricade");
      document.getElementById("best-num").textContent = best;
      if (isRecord) msg += " — New best! 🎉";
    }
    document.getElementById("overlay-title").textContent = won ? "You Cleared It! 🎉" : "Game Over";
    document.getElementById("overlay-msg").textContent = msg;
    document.getElementById("overlay-btn").textContent = "Play Again";
    document.getElementById("overlay").classList.add("show");
  }

  function startGame() {
    resetGame();
    draw();
    document.getElementById("overlay").classList.remove("show");
    running = true;
    clearInterval(loopId);
    loopId = setInterval(step, 16);
  }

  function movePaddleTo(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    const x = (clientX - rect.left) * scale;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W / 2));
  }

  canvas.addEventListener("mousemove", (e) => { if (running) movePaddleTo(e.clientX); });
  canvas.addEventListener("touchmove", (e) => {
    if (running) { movePaddleTo(e.touches[0].clientX); e.preventDefault(); }
  }, { passive: false });

  document.getElementById("overlay-btn").addEventListener("click", startGame);

  requireLogin(async (user) => {
    currentUser = user;
    const best = await getHighScore(user.uid, "barricade");
    document.getElementById("best-num").textContent = best;
  });

  resetGame();
  draw();
</script>
</body>
</html>
