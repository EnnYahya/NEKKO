<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nekko — Chess</title><link rel="stylesheet" href="css/style.css"></head><body><div class="paw-field"></div><div class="topbar"><div class="topbar-title">Nekko</div><div class="topbar-user"><a class="nav-link" href="dashboard.html">🏠 Home</a><a class="nav-link" href="profile.html">Profile</a></div></div><main class="game-screen" style="max-width:520px;"><h1>♟️ Chess</h1><p id="opponent-text" style="opacity:.7">Loading game…</p><div class="chess-status" id="status-text"></div><div class="chess-board" id="board"></div><p class="game-controls-hint">Choose one of your pieces, then choose a highlighted square. The game updates for both players automatically.</p></main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/chess-engine.js"></script>
<script>
const gameId=new URLSearchParams(location.search).get("game");let currentUser,gameRef,game,selected=null,legalTargets=[];
const boardEl=document.getElementById("board"),statusEl=document.getElementById("status-text");
function render(){if(!game)return;const myColor=game.whiteId===currentUser.uid?"w":"b",myTurn=game.turn===myColor&&game.status==="active";boardEl.innerHTML="";for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=document.createElement("div"),light=(r+c)%2===0;sq.className=`chess-square ${light?"light":"dark"}`;if(selected&&selected.r===r&&selected.c===c)sq.classList.add("selected");const t=legalTargets.find(x=>x.r===r&&x.c===c);if(t)sq.classList.add(game.board[r][c]?"legal-capture":"legal-move");sq.textContent=game.board[r][c]?pieceSymbol(game.board[r][c]):"";sq.onclick=()=>clickSquare(r,c,myTurn);boardEl.appendChild(sq)}const turnName=game.turn==="w"?game.playerUsernames[game.whiteId]:game.playerUsernames[game.blackId];statusEl.textContent=game.status==="active"?(myTurn?"Your turn":`${turnName}'s turn`):game.status;document.getElementById("opponent-text").textContent="Playing with "+(myColor==="w"?game.playerUsernames[game.blackId]:game.playerUsernames[game.whiteId]);}
function clickSquare(r,c,myTurn){if(!myTurn)return;if(selected){const t=legalTargets.find(x=>x.r===r&&x.c===c);if(t){move(selected,{r,c});selected=null;legalTargets=[];return}}const p=game.board[r][c],myColor=game.whiteId===currentUser.uid?"w":"b";if(p&&pieceColor(p)===myColor){selected={r,c};legalTargets=legalMoves(game.board,r,c)}else{selected=null;legalTargets=[]}render()}
async function move(from,to){const board=cloneBoard(game.board);board[to.r][to.c]=board[from.r][from.c];board[from.r][from.c]=null;if(pieceType(board[to.r][to.c])==="P"&&(to.r===0||to.r===7))board[to.r][to.c]=pieceColor(board[to.r][to.c])+"Q";const next=game.turn==="w"?"b":"w";let status="active";if(isInCheck(board,next)){let any=false;for(let r=0;r<8&&!any;r++)for(let c=0;c<8&&!any;c++)if(board[r][c]&&pieceColor(board[r][c])===next&&legalMoves(board,r,c).length)any=true;if(!any)status=(game.turn==="w"?"White":"Black")+" wins by checkmate"}else{let any=false;for(let r=0;r<8&&!any;r++)for(let c=0;c<8&&!any;c++)if(board[r][c]&&pieceColor(board[r][c])===next&&legalMoves(board,r,c).length)any=true;if(!any)status="Draw by stalemate"}try{await gameRef.update({board,turn:next,status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert(e.message)}}
requireLogin(u=>{currentUser=u;if(!gameId){location="dashboard.html";return}gameRef=db.collection("games").doc(gameId);gameRef.onSnapshot(d=>{if(!d.exists){statusEl.textContent="Game not found";return}game=d.data();if(!game.players.includes(u.uid)){statusEl.textContent="You are not a player in this game.";return}render()})})
function pieceSymbol(p){return {"wK":"♔","wQ":"♕","wR":"♖","wB":"♗","wN":"♘","wP":"♙","bK":"♚","bQ":"♛","bR":"♜","bB":"♝","bN":"♞","bP":"♟"}[p]}
</script></body></html>
