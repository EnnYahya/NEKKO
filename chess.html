<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Chess</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="topbar">
  <div class="topbar-title">
    <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
    Nekko
  </div>
  <div class="topbar-user">
    <a class="nav-link" href="games.html">← Games</a>
  </div>
</div>

<div class="game-screen" style="max-width:520px;">
  <h1 style="margin-bottom:6px;">♟️ Chess</h1>

  <div id="picker-screen" class="chess-picker" style="display:none;">
    <p>Play chess with a friend — moves sync live, no need to be on the same device.</p>
    <div class="new-chat-bar">
      <input type="text" id="opponent-username" placeholder="Friend's username…">
      <button id="start-game-btn">Play</button>
    </div>
  </div>

  <div id="game-screen-wrap" style="display:none;">
    <div class="chess-vs">You (<span id="my-color"></span>) vs <a id="opponent-link" href="#"></a></div>
    <div class="chess-status" id="status-text">Loading…</div>

    <div class="chess-board" id="board"></div>

    <div style="margin-top:16px;">
      <button class="btn btn-secondary" id="restart-btn" style="width:auto; padding:8px 20px;">Restart Game</button>
    </div>

    <div class="game-controls-hint">Tap a piece to see its legal moves, then tap a highlighted square to move.<br>No castling / en passant — pawns promote straight to queen.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/chess-engine.js"></script>
<script src="js/chess-online.js"></script>
<script>
  let currentUser = null;
  let currentProfile = null;
  let gameId = null;
  let gameUnsubscribe = null;
  let currentGame = null;
  let myColor = null;
  let selected = null;
  let legalTargets = [];

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show";
    setTimeout(() => t.className = "toast", 2200);
  }

  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status-text");

  function render() {
    if (!currentGame) return;
    const board = unflattenBoard(currentGame.board);
    boardEl.innerHTML = "";
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = document.createElement("div");
        const isLight = (r + c) % 2 === 0;
        square.className = `chess-square ${isLight ? "light" : "dark"}`;

        if (selected && selected.r === r && selected.c === c) square.classList.add("selected");

        const target = legalTargets.find(t => t.r === r && t.c === c);
        if (target) {
          square.classList.add(board[r][c] ? "legal-capture" : "legal-move");
        }

        const piece = board[r][c];
        if (piece) square.textContent = PIECE_SYMBOLS[piece];

        square.addEventListener("click", () => onSquareClick(r, c));
        boardEl.appendChild(square);
      }
    }
  }

  function myTurn() {
    return currentGame && currentGame.status === "active" && currentGame.turn === myColor;
  }

  function onSquareClick(r, c) {
    if (!myTurn()) return;
    const board = unflattenBoard(currentGame.board);
    const piece = board[r][c];

    if (selected) {
      const isTarget = legalTargets.some(t => t.r === r && t.c === c);
      if (isTarget) {
        const newBoard = applyMove(board, selected, { r, c });
        const newTurn = myColor === "w" ? "b" : "w";
        const status = getGameStatus(newBoard, newTurn);
        const winner = status === "checkmate" ? myColor : (status === "stalemate" ? "draw" : null);
        selected = null;
        legalTargets = [];
        submitChessMove(gameId, newBoard, newTurn, (status === "checkmate" || status === "stalemate") ? status : "active", winner)
          .catch(err => showToast(err.message));
        return;
      }
      if (piece && pieceColor(piece) === myColor) {
        selected = { r, c };
        legalTargets = legalMoves(board, r, c);
        render();
        return;
      }
      selected = null;
      legalTargets = [];
      render();
      return;
    }

    if (piece && pieceColor(piece) === myColor) {
      selected = { r, c };
      legalTargets = legalMoves(board, r, c);
      render();
    }
  }

  function updateStatus() {
    const opponent = otherChessPlayer(currentGame, currentUser.uid);
    document.getElementById("opponent-link").textContent = opponent.username;
    document.getElementById("opponent-link").href = `profile.html?u=${encodeURIComponent(opponent.username)}`;
    document.getElementById("my-color").textContent = myColor === "w" ? "White" : "Black";

    if (currentGame.status === "checkmate") {
      const winnerName = currentGame.winner === myColor ? "You" : opponent.username;
      statusEl.textContent = `Checkmate! ${winnerName} won 🎉`;
    } else if (currentGame.status === "stalemate") {
      statusEl.textContent = "Stalemate — it's a draw";
    } else {
      statusEl.textContent = myTurn() ? "Your move" : `Waiting for ${opponent.username}…`;
    }
  }

  document.getElementById("restart-btn").addEventListener("click", async () => {
    selected = null;
    legalTargets = [];
    try {
      await restartChessGame(gameId);
    } catch (err) {
      showToast(err.message);
    }
  });

  document.getElementById("start-game-btn").addEventListener("click", startGame);
  document.getElementById("opponent-username").addEventListener("keydown", (e) => {
    if (e.key === "Enter") startGame();
  });

  async function startGame() {
    const input = document.getElementById("opponent-username");
    const username = input.value.trim();
    if (!username) return;
    try {
      await findOrCreateChessGame(currentUser, currentProfile, username);
      window.location.href = `chess.html?with=${encodeURIComponent(username)}`;
    } catch (err) {
      showToast(err.message);
    }
  }

  function openGame(id) {
    gameId = id;
    document.getElementById("picker-screen").style.display = "none";
    document.getElementById("game-screen-wrap").style.display = "block";
    if (gameUnsubscribe) gameUnsubscribe();
    gameUnsubscribe = listenToChessGame(gameId, (game) => {
      if (!game) return;
      currentGame = game;
      myColor = game.playerColors[currentUser.uid];
      selected = null;
      legalTargets = [];
      updateStatus();
      render();
    });
  }

  requireLogin(async (user) => {
    currentUser = user;
    const doc = await db.collection("users").doc(user.uid).get();
    currentProfile = doc.data() || { username: "friend" };

    const params = new URLSearchParams(window.location.search);
    const withUsername = params.get("with");
    const withUid = params.get("uid");

    if (withUid) {
      try {
        const id = await startOrResumeChessGameWithUid(currentUser, currentProfile, withUid, params.get("name") || "friend");
        openGame(id);
      } catch (err) {
        showToast(err.message);
        document.getElementById("picker-screen").style.display = "block";
      }
    } else if (withUsername) {
      try {
        const id = await findOrCreateChessGame(currentUser, currentProfile, withUsername);
        openGame(id);
      } catch (err) {
        showToast(err.message);
        document.getElementById("picker-screen").style.display = "block";
      }
    } else {
      document.getElementById("picker-screen").style.display = "block";
    }
  });
</script>
</body>
</html>
