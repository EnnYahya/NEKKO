<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Chess</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="topbar">
  <div class="topbar-title">
    <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
    Nekko
  </div>
  <div class="topbar-user">
    <a class="nav-link" href="games.html">← Games</a>
  </div>
</div>

<div class="game-screen" style="max-width:520px;">
  <h1 style="margin-bottom:6px;">♟️ Chess</h1>
  <p style="font-size:13px; opacity:0.65; margin-bottom:16px;">Local pass-and-play — two people, one device</p>

  <div class="chess-status" id="status-text">White to move</div>

  <div class="chess-board" id="board"></div>

  <div style="margin-top:16px;">
    <button class="btn btn-secondary" id="restart-btn" style="width:auto; padding:8px 20px;">Restart Game</button>
  </div>

  <div class="game-controls-hint">Tap a piece to see its legal moves, then tap a highlighted square to move.<br>No castling / en passant — pawns promote straight to queen.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/chess-engine.js"></script>
<script>
  requireLogin(() => {});

  let board = createInitialBoard();
  let turn = "w";
  let selected = null;
  let legalTargets = [];
  let gameOver = false;

  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status-text");

  function render() {
    boardEl.innerHTML = "";
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = document.createElement("div");
        const isLight = (r + c) % 2 === 0;
        square.className = `chess-square ${isLight ? "light" : "dark"}`;

        if (selected && selected.r === r && selected.c === c) square.classList.add("selected");

        const target = legalTargets.find(t => t.r === r && t.c === c);
        if (target) {
          square.classList.add(board[r][c] ? "legal-capture" : "legal-move");
        }

        const piece = board[r][c];
        if (piece) square.textContent = PIECE_SYMBOLS[piece];

        square.addEventListener("click", () => onSquareClick(r, c));
        boardEl.appendChild(square);
      }
    }
  }

  function onSquareClick(r, c) {
    if (gameOver) return;
    const piece = board[r][c];

    if (selected) {
      const isTarget = legalTargets.some(t => t.r === r && t.c === c);
      if (isTarget) {
        board = applyMove(board, selected, { r, c });
        turn = turn === "w" ? "b" : "w";
        selected = null;
        legalTargets = [];
        updateStatus();
        render();
        return;
      }
      // Clicking another own piece re-selects instead of moving
      if (piece && pieceColor(piece) === turn) {
        selected = { r, c };
        legalTargets = legalMoves(board, r, c);
        render();
        return;
      }
      selected = null;
      legalTargets = [];
      render();
      return;
    }

    if (piece && pieceColor(piece) === turn) {
      selected = { r, c };
      legalTargets = legalMoves(board, r, c);
      render();
    }
  }

  function updateStatus() {
    const status = getGameStatus(board, turn);
    const colorName = turn === "w" ? "White" : "Black";

    if (status === "checkmate") {
      const winner = turn === "w" ? "Black" : "White";
      statusEl.textContent = `Checkmate! ${winner} wins 🎉`;
      gameOver = true;
    } else if (status === "stalemate") {
      statusEl.textContent = "Stalemate — it's a draw";
      gameOver = true;
    } else if (status === "check") {
      statusEl.textContent = `${colorName} is in check!`;
    } else {
      statusEl.textContent = `${colorName} to move`;
    }
  }

  document.getElementById("restart-btn").addEventListener("click", () => {
    board = createInitialBoard();
    turn = "w";
    selected = null;
    legalTargets = [];
    gameOver = false;
    statusEl.textContent = "White to move";
    render();
  });

  render();
</script>
</body>
</html>
