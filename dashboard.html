<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nekko — Home</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="paw-field"></div>
<div class="topbar"><div class="topbar-title"><div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none';this.parentElement.textContent='N';"></div>Nekko</div><div class="topbar-user"><a class="nav-link" href="chat.html">💬 Chat</a><a class="nav-link" id="my-profile-link" href="profile.html">👤 Profile</a><span id="welcome-text">Welcome!</span><button id="logout-btn">Log Out</button></div></div>
<main class="feed-shell">
<div class="composer"><textarea id="post-text" placeholder="What's on your mind?" maxlength="2000"></textarea><div class="composer-footer"><span class="text-only-note">✍️ Text posts only</span><button class="btn" id="post-btn">Post</button></div></div>
<div id="feed"></div><div class="empty-state" id="empty-feed" style="display:none;"><div class="paw-big">🐾</div><h2>No posts yet</h2><p>Be the first to post something!</p></div></main><div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/posts.js"></script>
<script>
let currentUser,currentProfile;const openComments=new Set(),commentUnsubscribers={},commentsCache={};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(()=>t.className="toast",2000)}
function profileLink(name){return `profile.html?user=${encodeURIComponent(name||"")}`}
function initials(n){return (n||"?")[0].toUpperCase()}
function renderPost(p){return `<article class="post-card"><div class="post-header"><div class="post-avatar">${initials(p.authorUsername)}</div><div><a class="post-username user-link" href="${profileLink(p.authorUsername)}">${escapeHtml(p.authorUsername)}</a><div class="post-time">${p.createdAt?p.createdAt.toDate().toLocaleString():"Just now"}</div></div></div><div class="post-text">${escapeHtml(p.text)}</div><div class="post-actions"><button onclick="toggleComments('${p.id}')">💬 ${p.commentCount||0}</button><button onclick="shareThisPost('${p.id}')">↗ Share</button></div><div class="comments-section ${openComments.has(p.id)?"show":""}" id="comments-${p.id}"><div class="comments-list" id="comments-list-${p.id}">${(commentsCache[p.id]||[]).map(renderComment).join("")}</div><form onsubmit="submitComment(event,'${p.id}')" class="comment-form"><input maxlength="500" placeholder="Write a comment…" required><button>Send</button></form></div></article>`}
function renderComment(c){return `<div class="comment"><div class="comment-avatar">${initials(c.authorUsername)}</div><div><a class="comment-username user-link" href="${profileLink(c.authorUsername)}">${escapeHtml(c.authorUsername)}</a>${escapeHtml(c.text)}</div></div>`}
function renderFeed(posts){document.getElementById("feed").innerHTML=posts.map(renderPost).join("");document.getElementById("empty-feed").style.display=posts.length?"none":"block"}
window.toggleComments=id=>{const s=document.getElementById(`comments-${id}`),open=s.classList.toggle("show");if(open){openComments.add(id);if(!commentUnsubscribers[id])commentUnsubscribers[id]=listenToComments(id,c=>{commentsCache[id]=c;const el=document.getElementById(`comments-list-${id}`);if(el)el.innerHTML=c.map(renderComment).join("")})}else openComments.delete(id)}
window.submitComment=async(e,id)=>{e.preventDefault();const input=e.target.querySelector("input");try{await addComment(id,currentUser,currentProfile,input.value);input.value=""}catch(err){toast(err.message)}}
window.shareThisPost=async id=>{toast(await sharePost(id)?"Link copied!":"Link ready to share")}
document.getElementById("post-btn").onclick=async()=>{const b=document.getElementById("post-btn");try{b.disabled=true;await createPost(currentUser,currentProfile,document.getElementById("post-text").value);document.getElementById("post-text").value=""}catch(e){toast(e.message)}finally{b.disabled=false}}
requireLogin(async u=>{currentUser=u;const d=await db.collection("users").doc(u.uid).get();currentProfile=d.data()||{username:"friend"};document.getElementById("welcome-text").textContent="Hey, "+currentProfile.username+"!";document.getElementById("my-profile-link").href=profileLink(currentProfile.username);listenToFeed(renderFeed)})
document.getElementById("logout-btn").onclick=async()=>{await handleLogout();location="index.html"}
</script></body></html>
