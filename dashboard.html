<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="topbar">
  <div class="topbar-title">
    <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
    Nekko
  </div>
  <div class="topbar-user">
    <a class="nav-link" href="games.html">🎮 Games</a>
    <a class="nav-link" href="chat.html">💬 Chat</a>
    <span id="welcome-text">Welcome!</span>
    <button id="logout-btn">Log Out</button>
  </div>
</div>

<div class="feed-shell">

  <div class="stories-bar" id="stories-bar"></div>
  <input type="file" id="story-file-input" accept="image/*,video/*" style="display:none;">

  <div class="composer">
    <textarea id="post-text" placeholder="What's on your mind?" maxlength="2000"></textarea>
    <div class="progress-bar" id="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="composer-footer">
      <div class="composer-attach">
        <label class="attach-label">
          📎 Photo / Video
          <input type="file" id="post-file" accept="image/*,video/*">
        </label>
        <span class="file-chip" id="file-chip"></span>
      </div>
      <button class="btn" id="post-btn">Post</button>
    </div>
  </div>

  <div id="feed"></div>

  <div class="empty-state" id="empty-feed" style="display:none;">
    <div class="paw-big">🐾</div>
    <h2>No posts yet</h2>
    <p>Be the first to post something!</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="story-viewer" id="story-viewer">
  <div class="story-progress-row" id="story-progress-row"></div>
  <div class="story-viewer-header">
    <span id="story-viewer-username"></span>
    <button class="story-viewer-close" id="story-viewer-close">✕</button>
  </div>
  <div class="story-tap-zone left" id="story-tap-left"></div>
  <div class="story-tap-zone right" id="story-tap-right"></div>
  <div id="story-media-container"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/posts.js"></script>
<script src="js/stories.js"></script>
<script>
  let currentUser = null;
  let currentProfile = null;
  const openComments = new Set();
  const commentUnsubscribers = {};
  const commentsCache = {}; // postId -> array of comments, so re-renders don't blank out open threads

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show";
    setTimeout(() => t.className = "toast", 2000);
  }

  function initials(username) {
    return (username || "?").charAt(0).toUpperCase();
  }

  function renderPost(post) {
    const isOpen = openComments.has(post.id);
    return `
      <div class="post-card" data-post-id="${post.id}">
        <div class="post-header">
          <div class="post-avatar">${initials(post.authorUsername)}</div>
          <div class="post-meta">
            <div class="post-username">${escapeHtml(post.authorUsername)}</div>
            <div class="post-time">${timeAgo(post.createdAt)}</div>
          </div>
        </div>
        ${post.text ? `<div class="post-text">${escapeHtml(post.text)}</div>` : ""}
        ${post.mediaUrl ? renderMedia(post) : ""}
        <div class="post-actions">
          <button class="post-action-btn" onclick="toggleComments('${post.id}')">💬 ${post.commentCount || 0} Comments</button>
          <button class="post-action-btn" onclick="shareThisPost('${post.id}')">🔗 Share</button>
        </div>
        <div class="comments-section ${isOpen ? "show" : ""}" id="comments-${post.id}">
          <div id="comments-list-${post.id}">${isOpen && commentsCache[post.id] ? commentsCache[post.id].map(renderComment).join("") : ""}</div>
          <form class="comment-form" onsubmit="submitComment(event, '${post.id}')">
            <input type="text" placeholder="Write a comment…" maxlength="500" required>
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    `;
  }

  function renderMedia(post) {
    if (post.mediaType === "video") {
      return `<video class="post-media" src="${post.mediaUrl}" controls></video>`;
    }
    return `<img class="post-media" src="${post.mediaUrl}" alt="post image">`;
  }

  function renderComment(c) {
    return `
      <div class="comment-item">
        <div class="comment-avatar">${initials(c.authorUsername)}</div>
        <div class="comment-bubble">
          <span class="comment-username">${escapeHtml(c.authorUsername)}</span>${escapeHtml(c.text)}
        </div>
      </div>
    `;
  }

  window.toggleComments = function(postId) {
    const section = document.getElementById(`comments-${postId}`);
    const isOpen = section.classList.toggle("show");
    if (isOpen) {
      openComments.add(postId);
      if (!commentUnsubscribers[postId]) {
        commentUnsubscribers[postId] = listenToComments(postId, (comments) => {
          commentsCache[postId] = comments;
          const listEl = document.getElementById(`comments-list-${postId}`);
          if (listEl) listEl.innerHTML = comments.map(renderComment).join("");
        });
      }
    } else {
      openComments.delete(postId);
    }
  };

  window.submitComment = async function(e, postId) {
    e.preventDefault();
    const input = e.target.querySelector("input");
    try {
      await addComment(postId, currentUser, currentProfile, input.value);
      input.value = "";
    } catch (err) {
      showToast(err.message);
    }
  };

  window.shareThisPost = async function(postId) {
    const copied = await sharePost(postId);
    showToast(copied ? "Link copied!" : "Link ready to share");
  };

  let storyGroupsCache = [];
  let viewerGroup = null;
  let viewerIndex = 0;
  let viewerTimer = null;
  const STORY_DURATION_MS = 5000;

  function renderStoriesBar() {
    const bar = document.getElementById("stories-bar");
    const myGroup = storyGroupsCache.find(g => g.authorId === currentUser.uid);
    const others = storyGroupsCache.filter(g => g.authorId !== currentUser.uid);

    let html;
    if (myGroup) {
      // I have an active story: tap the circle to view it, tap the small
      // "+" badge to add another.
      html = `
        <div class="story-circle-wrap">
          <div class="story-ring" onclick="openStoryViewer('${currentUser.uid}')" style="position:relative;">
            <div class="story-ring-inner">${initials(currentProfile.username)}</div>
          </div>
          <div class="story-label" onclick="document.getElementById('story-file-input').click()" style="cursor:pointer; text-decoration:underline;">+ Add</div>
        </div>
      `;
    } else {
      html = `
        <div class="story-circle-wrap" onclick="document.getElementById('story-file-input').click()">
          <div class="story-ring add-story"><div class="story-ring-inner">+</div></div>
          <div class="story-label">Add story</div>
        </div>
      `;
    }
    others.forEach(group => {
      html += `
        <div class="story-circle-wrap" onclick="openStoryViewer('${group.authorId}')">
          <div class="story-ring"><div class="story-ring-inner">${initials(group.authorUsername)}</div></div>
          <div class="story-label">${escapeHtml(group.authorUsername)}</div>
        </div>
      `;
    });
    bar.innerHTML = html;
  }

  document.getElementById("story-file-input").addEventListener("change", async (e) => {
    const fileInput = e.target;
    if (!fileInput.files[0]) return;
    showToast("Uploading story…");
    try {
      await createStory(currentUser, currentProfile, fileInput, () => {});
      showToast("Story posted!");
    } catch (err) {
      showToast(err.message);
    }
    fileInput.value = "";
  });

  window.openStoryViewer = function(authorId) {
    viewerGroup = storyGroupsCache.find(g => g.authorId === authorId);
    if (!viewerGroup) return;
    viewerIndex = 0;
    document.getElementById("story-viewer").classList.add("show");
    document.getElementById("story-viewer-username").textContent = viewerGroup.authorUsername;
    renderStoryProgress();
    showStoryAt(0);
  };

  function renderStoryProgress() {
    const row = document.getElementById("story-progress-row");
    row.innerHTML = viewerGroup.stories.map(() =>
      `<div class="story-progress-track"><div class="story-progress-fill"></div></div>`
    ).join("");
  }

  function showStoryAt(index) {
    clearTimeout(viewerTimer);
    const tracks = document.querySelectorAll("#story-progress-row .story-progress-track");
    tracks.forEach((t, i) => {
      t.classList.remove("done");
      t.querySelector(".story-progress-fill").style.transition = "none";
      t.querySelector(".story-progress-fill").style.width = "0%";
      if (i < index) t.classList.add("done");
    });

    if (index < 0) { closeStoryViewer(); return; }
    if (index >= viewerGroup.stories.length) { closeStoryViewer(); return; }
    viewerIndex = index;

    const story = viewerGroup.stories[index];
    const container = document.getElementById("story-media-container");
    container.innerHTML = story.mediaType === "video"
      ? `<video class="story-viewer-media" src="${story.mediaUrl}" autoplay muted playsinline></video>`
      : `<img class="story-viewer-media" src="${story.mediaUrl}" alt="story">`;

    requestAnimationFrame(() => {
      const fill = tracks[index].querySelector(".story-progress-fill");
      fill.style.transition = `width ${STORY_DURATION_MS}ms linear`;
      fill.style.width = "100%";
    });

    viewerTimer = setTimeout(() => showStoryAt(index + 1), STORY_DURATION_MS);
  }

  document.getElementById("story-tap-left").addEventListener("click", () => showStoryAt(viewerIndex - 1));
  document.getElementById("story-tap-right").addEventListener("click", () => showStoryAt(viewerIndex + 1));
  document.getElementById("story-viewer-close").addEventListener("click", closeStoryViewer);

  function closeStoryViewer() {
    clearTimeout(viewerTimer);
    document.getElementById("story-viewer").classList.remove("show");
    document.getElementById("story-media-container").innerHTML = "";
    viewerGroup = null;
  }

  let hasScrolledToSharedPost = false;

  requireLogin(async (user) => {
    currentUser = user;
    const doc = await db.collection("users").doc(user.uid).get();
    currentProfile = doc.data() || { username: "friend" };
    document.getElementById("welcome-text").textContent = "Hey, " + currentProfile.username + "!";

    listenToFeed((posts) => {
      const feedEl = document.getElementById("feed");
      const emptyEl = document.getElementById("empty-feed");
      if (posts.length === 0) {
        feedEl.innerHTML = "";
        emptyEl.style.display = "block";
      } else {
        emptyEl.style.display = "none";
        feedEl.innerHTML = posts.map(renderPost).join("");
      }

      // If this page was opened via a "Share" link (?post=ID), scroll to
      // that post and briefly highlight it — only do this once, the
      // first time the feed loads, not on every live update.
      if (!hasScrolledToSharedPost) {
        const params = new URLSearchParams(window.location.search);
        const sharedPostId = params.get("post");
        if (sharedPostId) {
          const target = feedEl.querySelector(`[data-post-id="${sharedPostId}"]`);
          if (target) {
            hasScrolledToSharedPost = true;
            setTimeout(() => {
              target.scrollIntoView({ behavior: "smooth", block: "center" });
              target.classList.add("highlighted");
              setTimeout(() => target.classList.remove("highlighted"), 2500);
            }, 100);
          }
        }
      }
    });

    listenToActiveStories((groups) => {
      storyGroupsCache = groups;
      renderStoriesBar();
    });
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await handleLogout();
    window.location.href = "index.html";
  });

  const fileInput = document.getElementById("post-file");
  fileInput.addEventListener("change", () => {
    const chip = document.getElementById("file-chip");
    if (fileInput.files[0]) {
      chip.textContent = fileInput.files[0].name;
      chip.className = "file-chip show";
    } else {
      chip.className = "file-chip";
    }
  });

  document.getElementById("post-btn").addEventListener("click", async () => {
    const btn = document.getElementById("post-btn");
    const textEl = document.getElementById("post-text");
    const progressBar = document.getElementById("progress-bar");
    const progressFill = document.getElementById("progress-fill");

    setLoading(btn, true, "Post");
    try {
      const hasFile = fileInput.files[0];
      if (hasFile) progressBar.className = "progress-bar show";

      await createPost(currentUser, currentProfile, textEl.value, fileInput, (pct) => {
        progressFill.style.width = pct + "%";
      });

      textEl.value = "";
      fileInput.value = "";
      document.getElementById("file-chip").className = "file-chip";
      progressBar.className = "progress-bar";
      progressFill.style.width = "0%";
      showToast("Posted!");
    } catch (err) {
      showToast(err.message);
    } finally {
      setLoading(btn, false, "Post");
    }
  });
</script>
</body>
</html>
