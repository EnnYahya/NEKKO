<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekko — Games</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paw-field"></div>

<div class="topbar">
  <div class="topbar-title">
    <div class="brand-mark"><img src="images/logo-placeholder.png" alt="Nekko logo" onerror="this.style.display='none'; this.parentElement.textContent='N';"></div>
    Nekko
  </div>
  <div class="topbar-user">
    <a class="nav-link" href="dashboard.html">🏠 Home</a>
    <a class="nav-link" href="chat.html">💬 Chat</a>
    <button id="logout-btn">Log Out</button>
  </div>
</div>

<div class="games-shell">
  <h1 style="margin-bottom:20px;">Mini Games</h1>

  <a class="game-card-link" href="snake.html">
    <div class="game-card">
      <div class="icon">🐍</div>
      <div>
        <div class="game-card-title">Snake</div>
        <div class="game-card-desc">Classic snake — eat, grow, don't hit yourself.</div>
      </div>
    </div>
  </a>

  <a class="game-card-link" href="barricade.html">
    <div class="game-card">
      <div class="icon">🧱</div>
      <div>
        <div class="game-card-title">Barricade</div>
        <div class="game-card-desc">Brick-breaker — bounce the ball, clear the wall.</div>
      </div>
    </div>
  </a>

  <a class="game-card-link" href="chess.html">
    <div class="game-card">
      <div class="icon">♟️</div>
      <div>
        <div class="game-card-title">Chess</div>
        <div class="game-card-desc">Local two-player, pass and play on one device.</div>
      </div>
    </div>
  </a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  requireLogin(() => {});
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await handleLogout();
    window.location.href = "index.html";
  });
</script>
</body>
</html>
