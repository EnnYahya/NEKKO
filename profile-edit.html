<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Profile</title><link rel="stylesheet" href="css/style.css"></head><body><div class="paw-field"></div><div class="topbar"><div class="topbar-title">Nekko</div><div class="topbar-user"><a class="nav-link" href="dashboard.html">Home</a></div></div><main class="profile-shell"><form class="profile-card" id="form"><h1>Edit Profile</h1><div class="field"><label>Name</label><input id="name" maxlength="40"></div><div class="field"><label>Bio</label><textarea id="bio" maxlength="300"></textarea></div><button class="btn">Save Profile</button></form></main><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script>requireLogin(async u=>{const ref=db.collection("users").doc(u.uid),d=await ref.get(),p=d.data();name.value=p.displayName||p.username;bio.value=p.bio||"";form.onsubmit=async e=>{e.preventDefault();await ref.update({displayName:name.value.trim()||p.username,bio:bio.value.trim()});location=`profile.html?user=${encodeURIComponent(p.username)}`}})</script></body></html>
