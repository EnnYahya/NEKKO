<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nekko — Profile</title><link rel="stylesheet" href="css/style.css"></head><body><div class="paw-field"></div>
<div class="topbar"><div class="topbar-title">Nekko</div><div class="topbar-user"><a class="nav-link" href="dashboard.html">🏠 Home</a><a class="nav-link" href="chat.html">💬 Chat</a><button id="logout-btn">Log Out</button></div></div>
<main class="profile-shell"><section class="profile-card"><div class="profile-avatar" id="avatar">?</div><h1 id="name">Loading…</h1><p class="profile-handle" id="handle"></p><p class="profile-bio" id="bio"></p><div class="profile-actions" id="actions"></div></section></main><div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/chat.js"></script><script src="js/games.js"></script>
<script>
const username=new URLSearchParams(location.search).get("user");let me,meProfile,targetUid,target;
function toast(m){let e=document.getElementById("toast");e.textContent=m;e.className="toast show";setTimeout(()=>e.className="toast",2000)}
requireLogin(async u=>{me=u;const mine=await db.collection("users").doc(u.uid).get();meProfile=mine.data();if(!username){targetUid=u.uid;target=meProfile}else{const x=await db.collection("usernames").doc(username.toLowerCase()).get();if(!x.exists){document.getElementById("name").textContent="User not found";return}targetUid=x.data().uid;const p=await db.collection("users").doc(targetUid).get();target=p.data()}document.getElementById("name").textContent=target.displayName||target.username;document.getElementById("handle").textContent="@"+target.username;document.getElementById("bio").textContent=target.bio||"No bio yet.";document.getElementById("avatar").textContent=(target.username||"?")[0].toUpperCase();const a=document.getElementById("actions");if(targetUid===u.uid){a.innerHTML='<a class="btn" href="profile-edit.html">Edit Profile</a>'}else{a.innerHTML='<button class="btn" id="chat-btn">💬 Chat</button><button class="btn btn-secondary" id="chess-btn">♟ Play Chess</button>';document.getElementById("chat-btn").onclick=async()=>{const id=await startConversationByUsername(me,meProfile,target.username);location="chat.html?conversation="+encodeURIComponent(id)};document.getElementById("chess-btn").onclick=async()=>{const id=await createOrOpenChessGame(me,meProfile,targetUid,target);location="chess.html?game="+encodeURIComponent(id)}}});
document.getElementById("logout-btn").onclick=async()=>{await handleLogout();location="index.html"}
</script></body></html>
